# Plan 2 todo 17 (WP-11): TEST.RSKRB5 issues a ticket whose transited path it
# did not check when the client asks for DISABLE-TRANSITED-CHECK (RFC 4120
# KDC option 26), instead of refusing it (MIT 1.22.2 do_tgs_req.c:924-948;
# the default reject_bad_transit = true refuses). The ticket then carries no
# TRANSITED-POLICY-CHECKED flag, as Active Directory's do, so the routing
# suite proves that the acceptor validates such a cross-realm ticket with
# [capaths] and refuses it without. A transit check that runs and fails still
# leaves the flag unset; no other suite crosses into TEST.RSKRB5 on an
# unchecked path.
[realms]
    TEST.RSKRB5 = {
        reject_bad_transit = false
    }
