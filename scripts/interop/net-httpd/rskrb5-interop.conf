# Apache site of the interop fixture `httpd` (lane 1D-b): /whoami/ requires
# Negotiate (SPNEGO, krb5 mechanism only, no Basic fallback) for the service
# key in /run/gssapi/http.keytab; the page echoes the authenticated principal
# (REMOTE_USER, the full Kerberos name) and the mechanism mod_auth_gssapi
# publishes (GSS_MECH). Everything else is 404.
ServerName httpd.test.rskrb5
<VirtualHost *:80>
    ServerName httpd.test.rskrb5
    DocumentRoot /var/www/rskrb5
    ErrorLog /dev/stderr
    CustomLog /dev/stdout "%h \"%r\" %>s user=%u"
    LogLevel warn auth_gssapi:info
    <Directory /var/www/rskrb5>
        Require all denied
    </Directory>
    <Location /whoami/>
        AuthType GSSAPI
        AuthName "rskrb5 interop"
        GssapiCredStore keytab:/run/gssapi/http.keytab
        GssapiAllowedMech krb5
        GssapiBasicAuth Off
        GssapiLocalName Off
        GssapiPublishMech On
        GssapiPublishErrors On
        Require valid-user
    </Location>
    <Directory /var/www/rskrb5/whoami>
        Options +Includes
        AddOutputFilter INCLUDES .shtml
        DirectoryIndex index.shtml
    </Directory>
</VirtualHost>
