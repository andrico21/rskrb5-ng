# kdc.conf of the second MIT interop realm (fixture mit-other, lane 1D-b):
# OTHER.RSKRB5 and the third realm FAR.EXAMPLE, served by one krb5kdc in the
# mit-kdc image (scripts/interop/net-other/fixture.sh). Each realm has its own
# database and stash on the container's tmpfs /var/lib/krb5kdc.
[kdcdefaults]
    kdc_ports = 88
    kdc_tcp_ports = 88

[realms]
    OTHER.RSKRB5 = {
        database_name = /var/lib/krb5kdc/principal-other
        key_stash_file = /var/lib/krb5kdc/.k5.OTHER.RSKRB5
        acl_file = /opt/interop/net-other/kadm5.acl
        kadmind_port = 749
        kpasswd_port = 464
        master_key_type = aes256-cts-hmac-sha1-96
        # The same list, in the same order, as TEST.RSKRB5 (mit/kdc.conf), so
        # the cross-realm principals get the same keys in both databases.
        supported_enctypes = aes256-cts-hmac-sha384-192:normal aes128-cts-hmac-sha256-128:normal aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal
        max_life = 1d
        max_renewable_life = 7d
    }
    FAR.EXAMPLE = {
        database_name = /var/lib/krb5kdc/principal-far
        key_stash_file = /var/lib/krb5kdc/.k5.FAR.EXAMPLE
        acl_file = /opt/interop/net-other/kadm5.acl
        master_key_type = aes256-cts-hmac-sha1-96
        supported_enctypes = aes256-cts-hmac-sha384-192:normal aes128-cts-hmac-sha256-128:normal aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal
        max_life = 1d
        max_renewable_life = 7d
    }

[logging]
    kdc = FILE:/var/log/krb5/krb5kdc.log
    admin_server = FILE:/var/log/krb5/kadmind.log
    default = FILE:/var/log/krb5/krb5lib.log
