# Lane 1D-a: SPAKE. The groups are enabled in krb5.conf.d/30-spake.conf
# ([libdefaults] spake_preauth_groups, read by KDC and clients). No
# spake_preauth_kdc_challenge (optimistic challenge): the standard
# two-round-trip flow is the one every client must support; the optimistic
# variant would hide it for the whole realm (EXECUTOR decision).
[realms]
    TEST.RSKRB5 = {
        spake_preauth_indicator = spake
    }
