# krb5.conf inside the mit-peer fixture containers (adapter, gss-client,
# gss-server). The KDC is reached by the network alias kdc.test.rskrb5 of the
# mit-kdc fixture; the isolated container (no route to that network) cannot
# resolve it, which is the point of the IAKERB scenarios.
[libdefaults]
    default_realm = TEST.RSKRB5
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    dns_canonicalize_hostname = false
    default_tkt_enctypes = aes256-cts-hmac-sha384-192
    default_tgs_enctypes = aes256-cts-hmac-sha384-192 aes256-cts-hmac-sha1-96

[realms]
    TEST.RSKRB5 = {
        kdc = kdc.test.rskrb5:88
    }

[domain_realm]
    .test.rskrb5 = TEST.RSKRB5
    test.rskrb5 = TEST.RSKRB5
