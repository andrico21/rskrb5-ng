feature_flags = []
security_divergence = "`KdcProtocol::Auto` follows changepw.c: one discovery for both protocols (`_kpasswd._udp` and `_kpasswd._tcp` are both queried and form one list; `_kerberos-adm._tcp` hosts at port 464 over both protocols only when neither set held a record, decided from the SRV answer before the targets are resolved), then TCP first over every endpoint and UDP only after the TCP pass failed; `udp_preference_limit` does not apply. A root SRV target adds no endpoint and the other records of its set are kept, as in MIT 1.22.2, which never aborts on one (dnssrv.c:332 appends a dot to every target, so the empty-host test at locate_kdc.c:380-383 cannot match, and sendto_kdc.c skips a name that resolves to nothing); with root targets only the call fails with `DnsServiceUnavailable` before any request is sent to a password server, where MIT ends in KRB5_KDC_UNREACH having sent nothing. A published set none of whose targets resolves (with `Tokio::with_dns_server`) counts as published: with no endpoint left the call fails with `KdcEndpointFailures` carrying the failure of every such set, UDP first, where MIT skips the unresolved names and ends in KRB5_KDC_UNREACH (sendto_kdc.c:753-780 and :1602-1604), and `_kerberos-adm` is asked only when the list is empty (changepw.c:68). Documented residual: the KDC path (`discover_srv_endpoints`) and the explicit `Tcp`/`Udp` discovery (its own root check in `password_dns::discover`) still discard a whole record set that mixes a root record with real records, where MIT uses the real ones. Explicit `Tcp` and `Udp` discover for their own protocol and apply the published rule to their own set (a published `_kpasswd` set of that protocol none of whose targets resolves fails with `KdcEndpointFailures` of that protocol, or with `DnsServiceUnavailable` when the set holds a root target, and `_kerberos-adm` is not asked); MIT has no explicit transport, changepw.c always runs its TCP pass and then its UDP pass over one list. Three kept divergences: (1) UDP is never tried after a TCP request that may have been delivered (the result is `KpasswdOutcomeUnknown`), where MIT kills the connection and then runs its UDP pass; (2) one datagram per endpoint with no retransmit, where MIT resends the datagram on each of up to three passes; (3) only `ConnectionRefused` or `ConnectionReset` while the single UDP reply is awaited is a plain endpoint failure and every other failure after the datagram was sent stays `KpasswdOutcomeUnknown`, where MIT treats any UDP receive error as that server failing."
disposition = "WP-15"
closing_plan = 2
closing_todo = 23
