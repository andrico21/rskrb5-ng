# kdc.conf of the MIT interop fixture (realm TEST.RSKRB5). Later lanes add
# relations through fragments in /etc/krb5kdc/kdc.conf.d/ (included last).
[kdcdefaults]
    kdc_ports = 88
    kdc_tcp_ports = 88

[realms]
    TEST.RSKRB5 = {
        database_name = /var/lib/krb5kdc/principal
        key_stash_file = /var/lib/krb5kdc/.k5.TEST.RSKRB5
        acl_file = /etc/krb5kdc/kadm5.acl
        kadmind_port = 749
        kpasswd_port = 464
        master_key_type = aes256-cts-hmac-sha1-96
        # AES-SHA2 first, so service tickets are encrypted in
        # aes256-cts-hmac-sha384-192; every principal also gets AES-SHA1 keys.
        supported_enctypes = aes256-cts-hmac-sha384-192:normal aes128-cts-hmac-sha256-128:normal aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal
        max_life = 1d
        max_renewable_life = 7d
    }

[logging]
    kdc = FILE:/var/log/krb5/krb5kdc.log
    admin_server = FILE:/var/log/krb5/kadmind.log
    default = FILE:/var/log/krb5/krb5lib.log

includedir /etc/krb5kdc/kdc.conf.d/
