[package]
name = "rskrb5-ng-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
rskrb5-ng = { version = "0.3.0", path = "..", features = [
  "camellia",
  "http",
  "pkinit",
  "spake",
] }

