  "tests/interop_exchange/scenarios.rs::keytab_exchange_obtains_the_service_principal_tgt",
]
feature_flags = []
security_divergence = "Every AS-REP is bound to its request: client, service, nonce and offered enctypes (`NonceMismatch` for a reply to another nonce). An exchange sends at most `MAX_EXCHANGE_ROUNDS` = 16 requests, MIT `MAX_IN_TKT_LOOPS` (`get_in_tkt.c:398`). Prompts carry no secret; a prompted password and every derived key are owned by erasing types and are erased when the exchange is dropped between steps (MIT prompters write into caller buffers). An unarmored AS request never sets `canonicalize`, so no unauthenticated reply changes the client identity (MIT sets it from the profile, `get_in_tkt.c`)."
disposition = "WP-04"
closing_plan = 2
closing_todo = 4
