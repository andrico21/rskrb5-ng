# kdcproxy configuration of the interop fixture `kdcproxy` (lane 1D-b): the
# TEST.RSKRB5 KDC and kpasswd of fixture mit-kdc, by network alias; no DNS
# discovery, no other realm (kdcproxy refuses realms it is not configured for).
[global]
use_dns = false

[TEST.RSKRB5]
kerberos = kerberos+tcp://kdc.test.rskrb5:88 kerberos+udp://kdc.test.rskrb5:88
kpasswd = kpasswd+tcp://kdc.test.rskrb5:464 kpasswd+udp://kdc.test.rskrb5:464
