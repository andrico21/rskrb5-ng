security_divergence = "Section headers and relation names are case-sensitive, as in MIT (prof_tree.c:588,615), but an enabled removed-protocol selector is refused whatever its case, and a module relation is refused whatever its case outside `[plugins]`, where only the exact lowercase `module` is refused (tests/config/plugin_case.rs::upper_module_is_unknown_relation). A missing or unreadable KRB5_CONFIG entry is an error (MIT skips it). The value-suffix final marker is kept as a gokrb5 extension beside MIT's tag* and [section]* forms. The profile reader is stricter than MIT in these cases, all listed in docs/config-profile.md (Deliberate divergences and bounds): non-comment content before the first section header, a BOM line included, is an InvalidLine (MIT ignores every line before the first one that starts with [, prof_parse.c:326, and so loses the first section behind a BOM; tests/config/mutation_profile.rs::profile_syntax_rejects_malformed_components); a relation whose name is empty after the final * marker is removed, such as * = A, is an InvalidLine (MIT accepts it as an unmatchable empty-name node: the empty-name check at prof_parse.c:152-153 runs before the marker is stripped at :203; a bare = A is an error in MIT too, PROF_RELATION_SYNTAX); an unclosed subsection at the end of a file is an InvalidRealmsSection in every section (MIT accepts it, prof_parse.c:418-436); a closing quote may be followed only by C-locale whitespace (MIT ignores the rest of the line; tests/config/value_whitespace_sites.rs::closing_quote_tail_uses_c_locale); a plugins disable or enable_only value that is empty or holds whitespace is an InvalidLine (MIT keeps it as one module name that matches nothing; tests/config/value_whitespace_sites.rs::capath_and_plugin_names_use_c_locale); every section is parsed and an enabled removed-protocol selector (krb4_*, v4_*, pkinit_win2k and the like) is a Policy::RejectedFeature in every section except domain_realm and the auth_to_local_names entries, which MIT's library does not read for it. The reader is more lenient than MIT in these cases, also listed in docs/config-profile.md: a comment after blanks may follow the opening brace of a subsection, so a value of the form A = { # c opens one where MIT reads the plain value { # c (prof_parse.c:177); a comment after C-locale whitespace may follow an unquoted value (profile_syntax.rs, comments), so default_realm = A #B is A here and A #B in MIT, which strips only trailing whitespace of an unquoted value and recognizes a comment only at the start of a line (prof_parse.c:179-183, :86); and an empty assignment with no { on the next line is an empty value, the same as name = \"\", in libdefaults, domain_realm, logging, kdcdefaults, dbmodules and an unknown section, where MIT answers PROF_MISSING_OBRACE when a line other than { follows (prof_parse.c:174-176, :331-334); so [domain_realm] .example.test = maps the domain to the empty realm and [libdefaults] default_realm = sets an empty default realm. A `~/` at the start of a KRB5_CONFIG entry is not expanded to the home directory (prof_file.c:188-207). KRB5_CONFIG is ignored in a process the secure-environment decision restricts (set-id), as MIT does through `secure_getenv` (init_os_ctx.c:300)."
