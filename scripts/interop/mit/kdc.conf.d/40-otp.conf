# Lane 1D-a: OTP preauth backed by the `radius` fixture (FreeRADIUS).
# The DEFAULT token type is the one the principals' `otp = []` attribute
# selects. The secret is a FILE (per-run, written by provision.d/40-otp.sh on
# tmpfs); radius.test.rskrb5 is the network alias of the radius container on
# the rskrb5-interop network.
[otp]
    DEFAULT = {
        server = radius.test.rskrb5:1812
        secret = /run/interop/otp/radius.secret
        timeout = 10
        retries = 1
        strip_realm = true
        indicator = otp
    }
