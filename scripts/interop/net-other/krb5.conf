# krb5.conf inside the mit-other container (lane 1D-b): used by kadmin.local,
# krb5kdc and kadmind of OTHER.RSKRB5 and FAR.EXAMPLE. The [capaths] here are
# the KDC side: the FAR.EXAMPLE KDC checks the transited path of TEST.RSKRB5
# clients (which crossed OTHER.RSKRB5) against them, and OTHER.RSKRB5 hands
# out the next TGT on that path. The client-side [capaths] a TEST client
# needs for FAR.EXAMPLE is in net-other/fixture.sh (net_other_client_conf).
[libdefaults]
    default_realm = OTHER.RSKRB5
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false

[realms]
    OTHER.RSKRB5 = {
        kdc = 127.0.0.1:88
        admin_server = 127.0.0.1:749
        kpasswd_server = 127.0.0.1:464
    }
    FAR.EXAMPLE = {
        kdc = 127.0.0.1:88
    }
    TEST.RSKRB5 = {
        kdc = kdc.test.rskrb5:88
    }

[domain_realm]
    .other.rskrb5 = OTHER.RSKRB5
    other.rskrb5 = OTHER.RSKRB5
    .far.example = FAR.EXAMPLE
    far.example = FAR.EXAMPLE
    .test.rskrb5 = TEST.RSKRB5
    test.rskrb5 = TEST.RSKRB5

[capaths]
    TEST.RSKRB5 = {
        OTHER.RSKRB5 = .
        FAR.EXAMPLE = OTHER.RSKRB5
    }
    OTHER.RSKRB5 = {
        TEST.RSKRB5 = .
        FAR.EXAMPLE = .
    }
    FAR.EXAMPLE = {
        OTHER.RSKRB5 = .
        TEST.RSKRB5 = OTHER.RSKRB5
    }
