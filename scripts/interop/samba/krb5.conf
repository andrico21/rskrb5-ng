# MIT client profile of the Samba AD DC fixtures (self-check tools inside the
# containers). entrypoint.sh replaces @DEFAULT_REALM@ with the container's
# own realm. The KDCs are named by their network aliases on rskrb5-interop;
# DNS lookups of KDCs and realms stay off, so the trust path is explicit.
[libdefaults]
 default_realm = @DEFAULT_REALM@
 dns_lookup_kdc = false
 dns_lookup_realm = false
 dns_canonicalize_hostname = false
 rdns = false
 forwardable = true
 udp_preference_limit = 1

[realms]
 USER.RSKRB5 = {
  kdc = dcuser.user.rskrb5
  admin_server = dcuser.user.rskrb5
  kpasswd_server = dcuser.user.rskrb5
 }
 RES.RSKRB5 = {
  kdc = dcres.res.rskrb5
  admin_server = dcres.res.rskrb5
  kpasswd_server = dcres.res.rskrb5
 }

[domain_realm]
 .user.rskrb5 = USER.RSKRB5
 user.rskrb5 = USER.RSKRB5
 .res.rskrb5 = RES.RSKRB5
 res.rskrb5 = RES.RSKRB5
