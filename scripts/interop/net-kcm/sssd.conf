# SSSD configuration of the interop fixture `kcm` (lane 1D-b): only the KCM
# responder, listening on the socket in the bind-mounted /run/kcm directory.
[kcm]
socket_path = /run/kcm/kcm.sock
# sssd_kcm exits after `responder_idle_timeout` seconds (default 300) without
# a client; the wave-1 run saw the container exit about 7.4 minutes after its
# start (register row FU-IOP-P04). 0 disables the timeout, so the daemon stays
# up for as long as the fixture does.
responder_idle_timeout = 0
