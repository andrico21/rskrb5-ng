# Plan 2 todo 5 (WP-03, Camellia): the fixture's permitted enctypes name
# Camellia, so the KDC (it reads this file too) and the MIT tools of the
# container permit the Camellia keys of provision.d/55-camellia.sh, next to the
# four AES enctypes every other lane uses. DES3 and RC4 stay out, as in the
# MIT default. The kdc.conf side needs no fragment: kdc.conf takes the first
# value of a relation, so the realm's supported_enctypes (AES only) cannot be
# extended from a fragment, and the Camellia principals carry their keys
# explicitly (kadmin addprinc -e).
[libdefaults]
    permitted_enctypes = aes256-cts-hmac-sha384-192 aes128-cts-hmac-sha256-128 aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96 camellia256-cts-cmac camellia128-cts-cmac
