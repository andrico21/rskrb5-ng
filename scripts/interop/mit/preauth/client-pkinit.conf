# Lane 1D-a: client-side PKINIT trust for the MIT tools run by the container
# self-checks (KRB5_CONFIG=/etc/krb5.conf:/opt/interop/mit/preauth/client-pkinit.conf).
# It is NOT an /etc/krb5.conf.d fragment: the KDC reads the same realm
# subsection of krb5.conf for its own pkinit_anchors (MIT pkinit_profile.c
# pkinit_kdcdefault_strings uses the merged profile and the realm subsection
# wins over [kdcdefaults]), which would shrink the KDC's client anchors to this
# one root. The EC root signed the KDC certificate; the file is generated per
# run by provision.d/45-pkinit.sh.
[realms]
    TEST.RSKRB5 = {
        pkinit_anchors = FILE:/run/interop/pki/ca-ec.pem
    }
