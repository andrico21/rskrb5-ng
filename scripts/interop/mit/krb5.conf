# krb5.conf inside the MIT interop fixture (used by kadmin.local, kinit and
# the daemons). Later lanes add fragments to /etc/krb5.conf.d/ (included last).
[libdefaults]
    default_realm = TEST.RSKRB5
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    # The MIT-kinit credential cache handed to the Rust tests carries an
    # aes256-cts-hmac-sha384-192 TGT session key (asserted there).
    default_tkt_enctypes = aes256-cts-hmac-sha384-192
    default_tgs_enctypes = aes256-cts-hmac-sha384-192 aes256-cts-hmac-sha1-96

[realms]
    TEST.RSKRB5 = {
        kdc = 127.0.0.1:88
        admin_server = 127.0.0.1:749
        kpasswd_server = 127.0.0.1:464
    }

[domain_realm]
    .test.rskrb5 = TEST.RSKRB5
    test.rskrb5 = TEST.RSKRB5

includedir /etc/krb5.conf.d/
