# Plan 2 todo 25 (WP-17, localauth): the auth_to_local relations of the realm,
# read by MIT's krb5_aname_to_localname and by this crate's LocalNameMapper
# (tests/interop_localauth compares them). Only localauth reads them: no other
# suite's client or the KDC consults auth_to_local.
[realms]
 TEST.RSKRB5 = {
  auth_to_local_names = {
   preauthuser = lauthnone
  }
  auth_to_local = RULE:[1:$1@$0](testuser1@TEST.RSKRB5)s/.*/lauthmapped/
  auth_to_local = RULE:[1:$1](kpasswduser)s/.*/lauthlist/
  auth_to_local = DEFAULT
 }
