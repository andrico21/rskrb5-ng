# Lane 1D-a: PKINIT. The files are generated per run on tmpfs by
# provision.d/45-pkinit.sh before the KDC starts: the KDC certificate and key,
# and the anchors that verify client certificates (an EC P-256 root and an
# RSA root). The client certificates must carry the standard PKINIT
# SAN and EKU (the secure default, pkinit_eku_checking is not weakened).
# pkinit_indicator marks tickets obtained by certificate authentication.
[kdcdefaults]
    pkinit_identity = FILE:/run/interop/pki/kdc.pem,/run/interop/pki/kdc.key
    pkinit_anchors = FILE:/run/interop/pki/anchors.pem
    pkinit_indicator = pkinit
