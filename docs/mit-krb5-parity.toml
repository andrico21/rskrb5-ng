feature_flags = ["camellia"]
security_divergence = "Camellia is compiled only with the additive `camellia` Cargo feature, which grants no runtime permission: `permitted_enctypes` must name it, a default policy refuses it for every use, and without the feature Camellia names keep their diagnostic (compatible mode) or error (strict mode) naming the feature. `DEFAULT` never includes Camellia (MIT's `DEFAULT` does) because the admitted RustCrypto `camellia` crate reads secret-indexed S-box tables and is not constant-time. Peer-supplied string-to-key work is bounded by 2^24 iterations and floored at 32768 (MIT has no floor)."
