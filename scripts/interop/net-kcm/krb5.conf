# krb5.conf inside the `kcm` fixture container (lane 1D-b): the server-side
# klist of the self-check reads the KCM cache through the fixture socket.
[libdefaults]
    default_realm = TEST.RSKRB5
    dns_lookup_kdc = false
    dns_lookup_realm = false
    kcm_socket = /run/kcm/kcm.sock

[realms]
    TEST.RSKRB5 = {
        kdc = kdc.test.rskrb5:88
    }
