name: interop

# Live interoperability (plan 2 todo 1): `scripts/interop/run.sh all` builds
# the pinned fixture images, starts them on a user-defined Docker network,
# runs every registered suite with INTEROP=1 INTEROP_REQUIRED=1 (an
# unreachable fixture fails, naming it; every listed scenario must run, none
# may skip) and removes every container, network and volume again, printing a
# cleanup receipt. The fixtures and the layout contract are in
# scripts/interop/ (lib.sh). Fixture logs are uploaded with the run's
# generated secrets redacted (scripts/interop/redact.sh).
#
# Jobs: `mit` (MIT krb5 1.22.2, realm TEST.RSKRB5). A Samba AD job is added
# by plan 2 todo 1 lane 1E below `mit`, with the same steps and its own
# suite. Actions are pinned to the commit SHAs ci.yml uses.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Thursday 05:17 UTC (ci.yml's advisory pass runs Monday 03:37 UTC).
    - cron: "17 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time; a newer push waits instead of cancelling a run
# that is proving an earlier SHA.
concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  mit:
    name: mit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INTEROP_RUNTIME: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
      - name: Toolchain guard (cargo and rustc on PATH)
        shell: bash
        run: |
          if command -v cargo && cargo -V && rustc -V; then
            exit 0
          fi
          echo "::error::no working cargo/rustc on PATH on runner image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          exit 1
      - name: Interop self-test (no containers)
        run: bash scripts/interop/run.sh self-test
      - name: Interop suite (MIT krb5 1.22.2)
        shell: bash
        run: INTEROP_LOG_DIR="$RUNNER_TEMP/interop-logs" scripts/interop/run.sh all
      - name: Upload the redacted fixture logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-mit-logs
          path: ${{ runner.temp }}/interop-logs
          if-no-files-found: warn
          retention-days: 14
  # Lane 1E inserts the `samba` job here.
